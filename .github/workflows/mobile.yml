name: Build mobile apps

# Builds the Android APK and the (unsigned) iOS app whenever the wrapper apps change.
# Download them from the run's Artifacts section.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (installable by sideloading)
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for a generic iOS device without signing
        working-directory: mobile/ios
        run: |
          xcodebuild build \
            -project NoVAIce.xcodeproj -scheme NoVAIce -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tail -40
          test -d build/Build/Products/Release-iphoneos/NoVAIce.app
      - name: Package as an unsigned .ipa (sign with your own Apple ID in Xcode or a sideloading tool)
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoVAIce.app Payload/
          zip -qr NoVAIce-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-ios-unsigned-ipa
          path: mobile/ios/NoVAIce-unsigned.ipa
          if-no-files-found: error
