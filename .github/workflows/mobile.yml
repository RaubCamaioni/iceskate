name: Build mobile apps

# Builds the Android APK and the (unsigned) iOS app whenever the wrapper apps change, then
# publishes both to the rolling "mobile-latest" GitHub Release so they have permanent download
# links (run artifacts expire after 90 days and need a GitHub login).
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: write   # the release job creates/replaces the mobile-latest release

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (installable by sideloading)
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for a generic iOS device without signing
        working-directory: mobile/ios
        run: |
          xcodebuild build \
            -project NoVAIce.xcodeproj -scheme NoVAIce -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tail -40
          test -d build/Build/Products/Release-iphoneos/NoVAIce.app
      - name: Package as an unsigned .ipa (sign with your own Apple ID in Xcode or a sideloading tool)
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoVAIce.app Payload/
          zip -qr NoVAIce-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-ios-unsigned-ipa
          path: mobile/ios/NoVAIce-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish to the Releases page
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the files for the release
        run: |
          mv dist/NoVAIce-android-debug-apk/app-debug.apk NoVAIce-android-debug.apk
          mv dist/NoVAIce-ios-unsigned-ipa/NoVAIce-unsigned.ipa NoVAIce-ios-unsigned.ipa
          ls -l NoVAIce-*
      - name: Write the release notes
        run: |
          {
            echo "Thin wrappers around https://raubcamaioni.github.io/iceskate/ - the site is the app, so these rarely need updating. Built from commit ${{ github.sha }}."
            echo
            echo "- **NoVAIce-android-debug.apk**: debug-signed. On the phone, open the file and allow installs from this source, or \`adb install NoVAIce-android-debug.apk\`."
            echo "- **NoVAIce-ios-unsigned.ipa**: not signed (Apple requires your own Apple ID). Sign it with a sideloading tool such as AltStore or Sideloadly, or open \`mobile/ios\` in Xcode and run on your phone. See \`mobile/README.md\`."
          } > notes.md
      - name: Replace the mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --cleanup-tag --yes || true
          gh release create mobile-latest NoVAIce-android-debug.apk NoVAIce-ios-unsigned.ipa --title "Mobile apps (latest build)" --notes-file notes.md
