name: Build mobile apps

# Builds the Android APK and the (unsigned) iOS app whenever the wrapper apps change (run
# artifacts, which expire after 90 days). Pushing a tag such as v0.1.0 also publishes both files
# to a GitHub Release of that name, with permanent download links:
#   https://github.com/RaubCamaioni/iceskate/releases/latest/download/NoVAIce-android-debug.apk
#   https://github.com/RaubCamaioni/iceskate/releases/latest/download/NoVAIce-ios-unsigned.ipa
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the release job publishes a GitHub Release on v* tags

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (installable by sideloading)
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for a generic iOS device without signing
        working-directory: mobile/ios
        run: |
          xcodebuild build \
            -project NoVAIce.xcodeproj -scheme NoVAIce -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tail -40
          test -d build/Build/Products/Release-iphoneos/NoVAIce.app
      - name: Package as an unsigned .ipa (sign with your own Apple ID in Xcode or a sideloading tool)
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoVAIce.app Payload/
          zip -qr NoVAIce-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NoVAIce-ios-unsigned-ipa
          path: mobile/ios/NoVAIce-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the files for the release
        run: |
          mv dist/NoVAIce-android-debug-apk/app-debug.apk NoVAIce-android-debug.apk
          mv dist/NoVAIce-ios-unsigned-ipa/NoVAIce-unsigned.ipa NoVAIce-ios-unsigned.ipa
          ls -l NoVAIce-*
      - name: Write the release notes
        run: |
          {
            echo "NoVA Ice ${{ github.ref_name }}: Android and iOS apps that show https://raubcamaioni.github.io/iceskate/ full screen. The site is the app, so schedule and feature updates arrive without reinstalling."
            echo
            echo "- **NoVAIce-android-debug.apk**: debug-signed. Open this link on the phone and install it (allow installs from this source), or run \`adb install NoVAIce-android-debug.apk\`."
            echo "- **NoVAIce-ios-unsigned.ipa**: not signed, because Apple requires your own Apple ID. Sign it with a sideloading tool such as AltStore or Sideloadly, or open \`mobile/ios\` in Xcode and run on your phone. See \`mobile/README.md\`."
            echo
            echo "Built from commit ${{ github.sha }}."
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" NoVAIce-android-debug.apk NoVAIce-ios-unsigned.ipa \
            --repo "${{ github.repository }}" --title "NoVA Ice ${{ github.ref_name }}" --notes-file notes.md
