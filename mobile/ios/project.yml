# XcodeGen spec: `xcodegen generate` in this folder writes NoVAIce.xcodeproj.
# (brew install xcodegen). The GitHub Actions workflow does the same on a macOS runner.
name: NoVAIce
options:
  bundleIdPrefix: com.raubcamaioni
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
targets:
  NoVAIce:
    type: application
    platform: iOS
    sources: [NoVAIce]
    info:
      path: NoVAIce/Info.plist
      properties:
        CFBundleDisplayName: NoVA Ice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Used only when you tap "Use my location" to sort rinks by driving time.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raubcamaioni.iceskate
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
